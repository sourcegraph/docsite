name: Go release
on:
  workflow_dispatch: {}
  release:
    types: [published]
jobs:
  release-linux-amd64:
    name: Release linux/amd64
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@61b9e3751b92087fd0b06925ba6dd6314e06f089 # master
    - name: Compile and release
      uses: sourcegraph/go-release.action@b84a0bd464f9f0f3221e270c972ccde91ffd8ab8 # v1.3.0
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        CGO_ENABLED: 0
        PACKAGE: ./cmd/docsite
        GOARCH: amd64
        GOOS: linux
        GOFLAGS: -buildvcs=false
  release-darwin-amd64:
    name: Release darwin/amd64
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@61b9e3751b92087fd0b06925ba6dd6314e06f089 # master
    - name: Compile and release
      uses: sourcegraph/go-release.action@b84a0bd464f9f0f3221e270c972ccde91ffd8ab8 # v1.3.0
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        CGO_ENABLED: 0
        PACKAGE: ./cmd/docsite
        GOARCH: amd64
        GOOS: darwin
        GOFLAGS: -buildvcs=false
  release-darwin-arm64:
    name: Release darwin/arm64
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@61b9e3751b92087fd0b06925ba6dd6314e06f089 # master
    - name: Compile and release
      uses: sourcegraph/go-release.action@b84a0bd464f9f0f3221e270c972ccde91ffd8ab8 # v1.3.0
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        CGO_ENABLED: 0
        PACKAGE: ./cmd/docsite
        GOARCH: arm64
        GOOS: darwin
        GOFLAGS: -buildvcs=false
  docker:
    name: Build and push image
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Login to Docker Hub
        uses: docker/login-action@465a07811f14bebb1938fbed4728c6a1ff8901fc # v2.2.0
        with:
          username: ${{ secrets.DOCKER_PASSWORD }}
          password: ${{ secrets.DOCKER_USERNAME }}

      - name: build-docsite-image
        uses: docker/build-push-action@0a97817b6ade9f46837855d676c4cca3a2471fc9 # v4.2.1
        with:
          context: .
          push: true
          tags: |
            sourcegraph/docsite:latest
            sourcegraph/docsite:${{ github.event.release.tag_name }}
